{% extends 'base.html' %}
{% block title %}Ganti Password{% endblock %}
{% block heading %}Ganti Password{% endblock %}
{% block content %}
<form method="post" class="card form-card narrow">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="field"><span>Password lama</span><input type="password" name="lama" required></label>
  <label class="field"><span>Password baru <em class="muted">(min. 6 karakter)</em></span><input type="password" name="baru" minlength="6" required></label>
  <label class="field"><span>Ulangi password baru</span><input type="password" name="ulang" minlength="6" required></label>
  <div class="form-actions"><a href="{{ url_for('dashboard') }}" class="btn btn-light">Batal</a><button class="btn btn-primary">Simpan</button></div>
</form>
{% endblock %}
