<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMONKIN — Demo</title>
    <style>
      :root {
        --bg: #f3f5f9;
        --card: #fff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --primary: #1e40af;
        --primary-2: #2563eb;
        --primary-soft: #e0e7ff;
        --side: #0f1e46;
        --side-2: #18295c;
        --green: #059669;
        --green-soft: #d1fae5;
        --red: #dc2626;
        --red-soft: #fee2e2;
        --amber: #b45309;
        --amber-soft: #fef3c7;
        --purple: #7c3aed;
        --purple-soft: #ede9fe;
        --teal: #0d9488;
        --teal-soft: #ccfbf1;
        --radius: 12px;
        --shadow:
          0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.5;
      }
      a {
        color: var(--primary-2);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.3;
      }
      h2 {
        font-size: 1.25rem;
      }
      h3 {
        font-size: 1.02rem;
      }
      code {
        background: #eef2f7;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .ic {
        flex-shrink: 0;
        vertical-align: -3px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      .strong {
        font-weight: 600;
      }
      .nowrap {
        white-space: nowrap;
      }
      .c {
        text-align: center;
      }
      .w100 {
        width: 100%;
      }
      .m0 {
        margin: 0 !important;
      }
      .mt4 {
        margin-top: 4px;
      }
      .mt16 {
        margin-top: 18px;
      }
      .inline {
        display: inline;
      }
      [hidden] {
        display: none !important;
      }

      /* layout */
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 252px;
        background: linear-gradient(180deg, var(--side), var(--side-2));
        color: #cbd5e1;
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 40;
        transition: transform 0.2s;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 20px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .logo.big {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        margin-bottom: 16px;
      }
      .brand-title {
        color: #fff;
        font-weight: 700;
        font-size: 15px;
      }
      .brand-sub {
        font-size: 12px;
        color: #94a3b8;
      }
      .nav {
        padding: 12px 10px;
        flex: 1;
        overflow: auto;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: 9px;
        color: #cbd5e1;
        margin-bottom: 2px;
        font-weight: 500;
      }
      .nav a:hover {
        background: rgba(255, 255, 255, 0.07);
        text-decoration: none;
        color: #fff;
      }
      .nav a.active {
        background: #2563eb;
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      }
      .nav-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        padding: 14px 12px 6px;
      }
      .nav-badge {
        margin-left: auto;
        background: #f59e0b;
        color: #111;
        font-size: 11px;
        font-weight: 700;
        border-radius: 20px;
        padding: 0 7px;
      }
      .sidebar-foot {
        padding: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .main {
        flex: 1;
        margin-left: 252px;
        min-width: 0;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 26px;
      }
      .page-title {
        font-size: 1.15rem;
        flex: 1;
      }
      .user-box {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-name {
        font-weight: 600;
        font-size: 13.5px;
      }
      .user-role {
        font-size: 12px;
        color: var(--muted);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 700;
        flex-shrink: 0;
      }
      .avatar.sm {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }
      .icon-btn {
        border: 0;
        background: transparent;
        width: 36px;
        height: 36px;
        border-radius: 9px;
        display: inline-grid;
        place-items: center;
        color: #475569;
        cursor: pointer;
      }
      .icon-btn:hover {
        background: #eef2f7;
        color: var(--primary);
      }
      .menu-btn {
        display: none;
      }
      .content {
        padding: 24px 26px 40px;
        max-width: 1500px;
      }
      .backdrop {
        display: none;
      }

      /* cards */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 18px;
      }
      .card.p0 {
        padding: 0;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 10px;
      }
      .card-head.pad {
        padding: 16px 20px 0;
      }
      .link {
        font-size: 13px;
        font-weight: 600;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .grid-2 > .card {
        margin-bottom: 0;
      }
      .grid-2 {
        margin-bottom: 18px;
      }

      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 8px 15px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none !important;
        line-height: 1.3;
        white-space: nowrap;
        justify-content: center;
      }
      .btn-primary {
        background: var(--primary-2);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary);
      }
      .btn-light {
        background: #fff;
        border-color: #d1d5db;
        color: #374151;
      }
      .btn-light:hover {
        background: #f9fafb;
        border-color: #9ca3af;
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-link {
        background: transparent;
        color: var(--primary-2);
        padding-left: 4px;
        padding-right: 4px;
      }
      .btn-ghost {
        background: transparent;
        color: #475569;
      }
      .btn-ghost:hover {
        background: #eef2f7;
        color: var(--primary);
      }
      .btn-ghost-danger {
        background: transparent;
        color: #94a3b8;
        border: 0;
      }
      .btn-ghost-danger:hover {
        background: var(--red-soft);
        color: var(--red);
      }
      .btn-outline-light {
        background: transparent;
        color: #cbd5e1;
        border-color: rgba(255, 255, 255, 0.18);
      }
      .btn-outline-light:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 13px;
        border-radius: 7px;
      }

      /* badges & chips */
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        border-radius: 6px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .b-green {
        background: var(--green-soft);
        color: var(--green);
      }
      .b-red {
        background: var(--red-soft);
        color: var(--red);
      }
      .b-amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .b-blue {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .b-gray {
        background: #f1f5f9;
        color: #475569;
      }
      .b-purple {
        background: var(--purple-soft);
        color: var(--purple);
      }
      .b-teal {
        background: var(--teal-soft);
        color: var(--teal);
      }
      .chip {
        display: inline-block;
        background: #f1f5f9;
        color: #475569;
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 12px;
        white-space: nowrap;
      }
      .chip.big {
        font-size: 13px;
        padding: 5px 12px;
      }

      /* alerts */
      .alert {
        padding: 11px 15px;
        border-radius: 10px;
        margin-bottom: 14px;
        border: 1px solid;
        font-weight: 500;
      }
      .alert-success {
        background: #ecfdf5;
        border-color: #a7f3d0;
        color: #065f46;
      }
      .alert-error {
        background: #fef2f2;
        border-color: #fecaca;
        color: #991b1b;
      }
      .alert-info {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: #1e3a8a;
      }

      /* dashboard */
      .welcome {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 18px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px;
        display: flex;
        gap: 14px;
        align-items: center;
        box-shadow: var(--shadow);
      }
      .stat-ic {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        display: grid;
        place-items: center;
      }
      .c-blue {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .c-green {
        background: var(--green-soft);
        color: var(--green);
      }
      .c-red {
        background: var(--red-soft);
        color: var(--red);
      }
      .c-amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .stat-num {
        font-size: 1.6rem;
        font-weight: 800;
        line-height: 1.1;
      }
      .stat-lbl {
        color: var(--muted);
        font-size: 13px;
      }
      .list-item {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 11px 8px;
        border-radius: 10px;
        color: inherit;
        border-bottom: 1px solid #f1f5f9;
      }
      .list-item:last-child {
        border-bottom: 0;
      }
      a.list-item:hover {
        background: #f8fafc;
        text-decoration: none;
      }
      .li-body {
        flex: 1;
        min-width: 0;
      }
      .li-title {
        font-weight: 600;
      }
      .li-meta {
        color: var(--muted);
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .date-box {
        width: 48px;
        min-width: 48px;
        height: 50px;
        border-radius: 10px;
        background: var(--primary-soft);
        color: var(--primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.05;
      }
      .date-box b {
        font-size: 18px;
      }
      .date-box span {
        font-size: 11px;
        text-transform: uppercase;
      }
      .date-box.warn {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .date-box.rem {
        background: var(--purple-soft);
        color: var(--purple);
      }
      .date-box.evt {
        background: var(--teal-soft);
        color: var(--teal);
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 22px;
      }
      .event-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 12px;
      }
      .event-card {
        border: 1px solid var(--line);
        border-left: 4px solid var(--teal);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .event-card.reminder {
        border-left-color: var(--purple);
      }
      .ev-type {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 700;
      }
      .ev-title {
        font-weight: 600;
        margin: 2px 0;
      }

      /* toolbar, filters, table */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filters input[type="search"] {
        min-width: 280px;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        padding: 8px 11px;
        background: #fff;
        width: 100%;
      }
      .filters input,
      .filters select {
        width: auto;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary-2);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      textarea {
        resize: vertical;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .table th {
        background: #f8fafc;
        text-align: left;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #475569;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .table td {
        padding: 11px 12px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: top;
      }
      .table tr:hover td {
        background: #fafbff;
      }
      .table td a {
        color: inherit;
      }
      .table td.strong a:hover {
        color: var(--primary-2);
      }
      .row-past td {
        background: #fbfbfc;
        color: #64748b;
      }
      .dispo-line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        padding: 2px 0;
        white-space: nowrap;
      }
      .actions-cell form {
        display: inline;
      }
      .file-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--primary-2) !important;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* forms */
      .form-card {
        max-width: 880px;
      }
      .form-card.narrow {
        max-width: 620px;
      }
      .form-card h3 {
        margin-bottom: 14px;
      }
      .form-section {
        font-weight: 700;
        color: var(--primary);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 20px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--line);
      }
      .form-section:first-of-type {
        margin-top: 0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .span-2 {
        grid-column: span 2;
      }
      .field {
        display: block;
        margin-bottom: 14px;
      }
      .field > span {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 5px;
      }
      .req {
        color: var(--red);
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .check input {
        width: auto;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .seg {
        display: inline-flex;
        background: #f1f5f9;
        border-radius: 10px;
        padding: 3px;
      }
      .seg label {
        cursor: pointer;
      }
      .seg input {
        display: none;
      }
      .seg span {
        display: block;
        padding: 6px 18px;
        border-radius: 8px;
        font-weight: 600;
        color: #475569;
      }
      .seg input:checked + span {
        background: #fff;
        color: var(--primary);
        box-shadow: var(--shadow);
      }

      /* disposisi picker */
      .dispo-picker {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: #fafbfc;
        margin-bottom: 12px;
      }
      .dp-tools {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .dp-tools input {
        max-width: 340px;
      }
      .dp-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 8px;
        max-height: 330px;
        overflow: auto;
      }
      .dp-item {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        cursor: pointer;
      }
      .dp-item input {
        width: auto;
        accent-color: var(--primary-2);
        transform: scale(1.15);
      }
      .dp-item > div {
        flex: 1;
        min-width: 0;
      }
      .dp-item:has(input:checked) {
        border-color: var(--primary-2);
        background: #eff6ff;
      }

      /* detail */
      .detail-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .detail-head h2 {
        margin: 2px 0 6px;
      }
      .dl {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px 20px;
        margin: 0;
      }
      .dl.one {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .dl dt {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
      }
      .dl dd {
        margin: 2px 0 0;
        font-weight: 500;
      }
      .dl .span-2 {
        grid-column: span 3;
      }

      /* tugas */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 9px 16px;
        color: #475569;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tab:hover {
        text-decoration: none;
        color: var(--primary);
      }
      .tab.active {
        color: var(--primary-2);
        border-bottom-color: var(--primary-2);
      }
      .task {
        display: flex;
        gap: 16px;
        align-items: center;
        border-left: 4px solid #f59e0b;
      }
      .task-ef {
        border-left-color: var(--green);
      }
      .task-tef {
        border-left-color: var(--red);
      }
      .task-main {
        flex: 1;
        min-width: 0;
      }
      .task-top {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .task h3 {
        margin-bottom: 4px;
      }
      .task h3 a {
        color: inherit;
      }
      .task-info {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        font-size: 13px;
        margin: 8px 0 4px;
        color: #374151;
      }
      .task-report {
        background: #f8fafc;
        border-radius: 9px;
        padding: 10px 12px;
        margin-top: 10px;
        font-size: 13px;
        display: grid;

              q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");

        var F = { q: "", bulan: "", status: "" };
        function filteredRapat() {
          var q = F.q.toLowerCase();
          return DB.rapat
            .filter(function (r) {
              var ds = dispoOf(r.id);
              if (q) {
                var txt = [
                  r.perihal,
                  r.no_dispo_kabag,
                  r.no_surat_undangan,
                  r.asal_undangan,
                  r.tempat,
                  r.pimpinan_rapat,
                ]
                  .concat(
                    ds.map(function (d) {
                      return pegNama(d.pegawai_id);
                    }),
                  )
                  .join(" ")
                  .toLowerCase();
                if (txt.indexOf(q) < 0) return false;
              }
              if (F.bulan && r.waktu.slice(0, 7) !== F.bulan) return false;
              if (
                F.status === "belum" &&
                !ds.some(function (d) {
                  return !d.status;
                })
              )
                return false;
              if (
                F.status === "lengkap" &&
                ds.some(function (d) {
                  return !d.status;
                })
              )
                return false;
              if (
                F.status === "efektif" &&
                !ds.some(function (d) {
                  return d.status === "EFEKTIF";
                })
              )
                return false;
              if (
                F.status === "tidak" &&
                !ds.some(function (d) {
                  return d.status === "TIDAK EFEKTIF";
                })
              )
                return false;
              return true;
            })
            .sort(function (a, b) {
              return a.waktu < b.waktu ? 1 : -1;
            });
        }

        var KAL = null;
        function viewKalender(q) {
          var t = new Date(),
            y = +q.y || t.getFullYear(),
            m = +q.m || t.getMonth() + 1;
          var first = new Date(y, m - 1, 1),
            off = (first.getDay() + 6) % 7,
            start = new Date(y, m - 1, 1 - off);
          var last = new Date(y, m, 0),
            endOff = 6 - ((last.getDay() + 6) % 7),
            end = new Date(y, m - 1, last.getDate() + endOff);
          var sK = dateKey(start),
            eK = dateKey(end),
            items = {},
            pid = myPid();
          function add(k, it) {
            (items[k] = items[k] || []).push(it);
          }
          DB.rapat.forEach(function (r) {
            var k = r.waktu.slice(0, 10);
            if (k < sK || k > eK) return;
            var ds = dispoOf(r.id),
              cls;
            if (isAdmin())
              cls =
                ds.length &&
                !ds.some(function (d) {
                  return !d.status;
                })
                  ? "rapat-done"
                  : "rapat";
            else {
              var mine = ds.filter(function (d) {
                return d.pegawai_id === pid;
              })[0];
              if (!mine) return;
              cls =
                { EFEKTIF: "rapat-done", "TIDAK EFEKTIF": "rapat-no" }[
                  mine.status
                ] || "rapat";
            }
            add(k, {
              cls: cls,
              jam: jam(r.waktu),
              judul: r.perihal,
              url: "#/rapat/" + r.id,
              info: r.tempat,
              t: r.waktu,
            });
          });
          visibleEvents().forEach(function (e) {
            var d0 = parse(e.mulai.slice(0, 10)),
              d1 = parse((e.selesai || e.mulai).slice(0, 10));
            for (var d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) {
              var k = dateKey(d);
              if (k < sK || k > eK) continue;
              add(k, {
                cls: e.jenis,
                jam:
                  k === e.mulai.slice(0, 10) &&
                  e.mulai.slice(11, 16) !== "00:00"
                    ? jam(e.mulai)
                    : "",
                judul: e.judul,
                url: "#/event",
                info: e.deskripsi || "",
                t: e.mulai,
              });
            }
          });
          var pm = m === 1 ? [y - 1, 12] : [y, m - 1],
            nm = m === 12 ? [y + 1, 1] : [y, m + 1],
            todayK = dateKey(t);
          var h =
            '<div class="toolbar"><div class="cal-nav"><a class="icon-btn" href="#/kalender?y=' +
            pm[0] +
            "&m=" +
            pm[1] +
            '">' +
            icon("chev-l") +
            "</a><h2>" +
            BULAN[m] +
            " " +
            y +
            '</h2><a class="icon-btn" href="#/kalender?y=' +
            nm[0] +
            "&m=" +
            nm[1] +
            '">' +
            icon("chev-r") +
            '</a><a class="btn btn-sm btn-light" href="#/kalender">Hari ini</a></div>' +
            '<div class="legend"><span><i class="dot rapat"></i>Rapat ' +
            (isAdmin() ? "(belum lengkap)" : "(belum lapor)") +
            '</span><span><i class="dot rapat-done"></i>' +
            (isAdmin() ? "Laporan lengkap" : "Efektif") +
            "</span>" +
            (isAdmin()
              ? ""
              : '<span><i class="dot rapat-no"></i>Tidak efektif</span>') +
            '<span><i class="dot event"></i>Event</span><span><i class="dot reminder"></i>Reminder</span></div></div>' +
            '<div class="card p0 cal"><div class="cal-head">' +
            ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"]
              .map(function (x) {
                return "<div>" + x + "</div>";
              })
              .join("") +
            "</div>";
          var d = new Date(start);
          while (d <= end) {
            h += '<div class="cal-row">';
            for (var i = 0; i < 7; i++) {
              var k = dateKey(d),
                its = (items[k] || []).sort(function (a, b) {
                  return a.t < b.t ? -1 : 1;
                });
              h +=
                '<div class="cal-cell ' +
                (d.getMonth() + 1 !== m ? "other " : "") +
                (k === todayK ? "today " : "") +
                (i >= 5 ? "weekend" : "") +
                '"><div class="cal-day"><span>' +
                d.getDate() +
                "</span>" +
                (isAdmin()
                  ? '<a href="#/rapat/baru?tanggal=' +
                    k +
                    '" class="cal-add" title="Tambah rapat">+</a>'
                  : "") +
                "</div>" +
                its
                  .map(function (it) {
                    return (
                      '<a href="' +
                      it.url +
                      '" class="cal-item ' +
                      it.cls +
                      '" title="' +
                      esc(it.judul + (it.info ? " — " + it.info : "")) +
                      '">' +
                      (it.jam ? "<b>" + it.jam + "</b> " : "") +
                      esc(it.judul) +
                      "</a>"
                    );
                  })
                  .join("") +
                "</div>";
              d.setDate(d.getDate() + 1);
            }
            h += "</div>";
          }
          return h + "</div>";
        }

        function rekapData(bulan) {
          var rids = DB.rapat
            .filter(function (r) {
              return !bulan || r.waktu.slice(0, 7) === bulan;
            })
            .map(function (r) {
              return r.id;
            });
          return DB.pegawai
            .map(function (p) {
              var ds = DB.dispo.filter(function (d) {
                return d.pegawai_id === p.id && rids.indexOf(d.rapat_id) > -1;
              });
              var o = {
                p: p,
                total: ds.length,
                ef: ds.filter(function (d) {
                  return d.status === "EFEKTIF";
                }).length,
                tef: ds.filter(function (d) {
                  return d.status === "TIDAK EFEKTIF";
                }).length,
                belum: ds.filter(function (d) {
                  return !d.status;
                }).length,
              };
              o.persen = o.total ? Math.round((o.ef * 100) / o.total) : 0;
              return o;
            })
            .filter(function (o) {
              return o.p.aktif || o.total;
            })
            .sort(function (a, b) {
              return b.total - a.total || a.p.nama.localeCompare(b.p.nama);
            });
        }

        /* ====================== after render (widgets) ====================== */
        function afterRender() {
          var dpList = document.getElementById("dpList"),
            dpCount = document.getElementById("dpCount"),
            dpSearch = document.getElementById("dpSearch");
          function cnt() {
            if (dpCount)
              dpCount.textContent =
                dpList.querySelectorAll("input:checked").length +
                " pegawai dipilih";
          }
          if (dpList) {
            dpList.addEventListener("change", cnt);
            cnt();
          }
          if (dpSearch) {
            dpSearch.addEventListener("input", function () {
              var q = dpSearch.value.toLowerCase().trim();
              dpList.querySelectorAll(".dp-item").forEach(function (el) {
                el.style.display =
                  !q || el.dataset.text.indexOf(q) > -1 ? "" : "none";
              });
            });
            dpSearch.addEventListener("keydown", function (e) {
              if (e.key === "Enter") e.preventDefault();
            });
          }
          var form = document.getElementById("laporForm");
          if (form) {
            var d = byId(DB.dispo, +form.dataset.id),
              input = document.getElementById("bukti"),
              dz = document.getElementById("dropzone"),
              dzText = document.getElementById("dzText"),
              dzDefault = dzText.innerHTML;
            var sync = function () {
              var st = (form.querySelector("input[name=status]:checked") || {})
                  .value,
                tidak = st === "TIDAK EFEKTIF";
              document.getElementById("fileActive").hidden = tidak;
              document.getElementById("fileEmpty").hidden = !tidak;
              document.getElementById("fileReq").hidden = tidak;
              if (tidak) {
                input.value = "";
                pendingFile = null;
                showName();
              }
            };
            var showName = function () {
              if (pendingFile) {
                dz.classList.add("has-file");
                dzText.innerHTML =
                  "<b>" +
                  esc(pendingFile.name) +
                  "</b> (" +
                  Math.round(pendingFile.size / 1024) +
                  " KB)";
              } else {
                dz.classList.remove("has-file");
                dzText.innerHTML = dzDefault;
              }
            };
            var take = function (file) {
              if (!file) return;
              var ext = (file.name.split(".").pop() || "").toLowerCase();
              if (
                [
                  "pdf",
                  "png",
                  "jpg",
                  "jpeg",
                  "doc",
                  "docx",
                  "xls",
                  "xlsx",
                  "ppt",
                  "pptx",
                ].indexOf(ext) < 0
              ) {
                laporErr("Format file tidak didukung.");
                input.value = "";
                return;
              }
              if (file.size > 10 * 1024 * 1024) {
                laporErr("Ukuran file terlalu besar. Maksimal 10 MB.");
                input.value = "";
                return;
              }
              laporErr("");
              pendingFile = { name: file.name, size: file.size, data: null };
              if (file.size < 1.5 * 1024 * 1024) {
                var fr = new FileReader();
                fr.onload = function () {
                  if (pendingFile) pendingFile.data = fr.result;
                };
                fr.readAsDataURL(file);
              }
              showName();
            };
            form.querySelectorAll("input[name=status]").forEach(function (r) {
              r.addEventListener("change", sync);
            });
            input.addEventListener("change", function () {
              take(input.files[0]);
            });
            ["dragover", "dragenter"].forEach(function (ev) {
              dz.addEventListener(ev, function (e) {
                e.preventDefault();
                dz.classList.add("drag");
              });
            });
            ["dragleave", "drop"].forEach(function (ev) {
              dz.addEventListener(ev, function () {
                dz.classList.remove("drag");
              });
            });
            dz.addEventListener("drop", function (e) {
              e.preventDefault();
              take(e.dataTransfer.files[0]);
            });
            sync();
          }
        }

        /* ====================== export (CSV utk Excel) ====================== */
        function download(name, rows) {
          var csv =
            "\ufeff" +
            rows
              .map(function (r) {
                return r
                  .map(function (c) {
                    c = String(c == null ? "" : c);
                    return /[";\n]/.test(c)
                      ? '"' + c.replace(/"/g, '""') + '"'
                      : c;
                  })
                  .join(";");
              })
              .join("\r\n");
          try {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob([csv], { type: "text/csv;charset=utf-8" }),
            );
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            toast(
              '<b>File ekspor dibuat</b><div class="small">' +
                esc(name) +
                " — jika unduhan tidak muncul (mode pratinjau), buka file ini langsung di browser.</div>",
              6000,
            );
          } catch (e) {
            toast("<b>Ekspor tidak tersedia di mode pratinjau</b>");
          }
        }

              "NO DISPO KABAG",
              "NO SURAT UNDANGAN",
              "ASAL UNDANGAN",
              "PERIHAL (AGENDA RAPAT)",
              "PIMPINAN RAPAT",
              "TEMPAT",
              "TANGGAL",
              "JAM",
              "DISPOSISI",
              "STATUS KINERJA",
              "FILE BUKTI",
              "CATATAN",
              "KETERANGAN",
            ],
          ];
          filteredRapat()
            .reverse()
            .forEach(function (r, i) {
              var ds = dispoOf(r.id);
              if (!ds.length) ds = [null];
              ds.forEach(function (d, j) {
                rows.push([
                  j ? "" : i + 1,
                  r.no_dispo_kabag,
                  r.no_surat_undangan,
                  r.asal_undangan,
                  r.perihal,
                  r.pimpinan_rapat,
                  r.tempat,
                  tgl(r.waktu),
                  jam(r.waktu),
                  d ? pegNama(d.pegawai_id) : "-",
                  d ? d.status || "BELUM LAPOR" : "-",
                  d && d.file ? d.file.name : "-",
                  d ? d.catatan : "",
                  r.keterangan,
                ]);
              });
            });
          download("jadwal-rapat-" + (F.bulan || "semua") + ".csv", rows);
        }
        function exportRekap(bulan) {
          var rows = [
            [
              "NO",
              "NIP",
              "NAMA",
              "JABATAN",
              "UNIT",
              "TOTAL TUGAS",
              "EFEKTIF",
              "TIDAK EFEKTIF",
              "BELUM LAPOR",
              "% EFEKTIF",
            ],
          ];
          rekapData(bulan).forEach(function (r, i) {
            rows.push([
              i + 1,
              "'" + (r.p.nip || ""),
              r.p.nama,
              r.p.jabatan,
              r.p.unit,
              r.total,
              r.ef,
              r.tef,
              r.belum,
              r.persen + "%",
            ]);
          });
          download("rekap-kinerja-" + (bulan || "semua") + ".csv", rows);
        }

        /* ====================== reminders ====================== */
        var shownKeys = {};
        function checkReminders() {
          if (!me()) return;
          var now = new Date(),
            nowS = toStr(now),
            out = [];
          visibleEvents().forEach(function (e) {
            if (!e.ingatkan_menit) return;
            var st = parse(e.mulai);
            if (st - e.ingatkan_menit * 60000 <= now && now <= st)
              out.push({
                key: "e" + e.id + e.mulai,
                jenis: e.jenis === "reminder" ? "Reminder" : "Event",
                judul: e.judul,
                waktu: tgljam(e.mulai),
                sisa: relatif(e.mulai),
                url: "#/event",
              });
          });
          var m = +DB.settings.pengingat_rapat_menit,
            pid = myPid();
          if (pid && m > 0)
            DB.dispo.forEach(function (d) {
              if (d.pegawai_id !== pid) return;
              var r = byId(DB.rapat, d.rapat_id),
                st = parse(r.waktu);
              if (r.waktu >= nowS && st - m * 60000 <= now)
                out.push({
                  key: "r" + r.id + r.waktu,
                  jenis: "Rapat",
                  judul: r.perihal,
                  waktu: tgljam(r.waktu) + " • " + r.tempat,
                  sisa: relatif(r.waktu),
                  url: "#/rapat/" + r.id,
                });
            });
          out.forEach(function (it) {
            var k = DB.session + it.key;
            if (shownKeys[k]) return;
            shownKeys[k] = 1;
            toast(
              "<b>" +
                esc(it.jenis) +
                ": " +
                esc(it.judul) +
                '</b><div class="small">' +
                esc(it.waktu) +
                " · " +
                esc(it.sisa) +
                '</div><a href="' +
                it.url +
                '">Lihat detail</a>',
            );
          });
        }
        setInterval(checkReminders, 60000);

        /* ====================== global events ====================== */
        document.addEventListener("submit", function (e) {
          var f = e.target;
          if (!f.dataset.form || !H[f.dataset.form]) return;
          e.preventDefault();
          H[f.dataset.form](f, new FormData(f));
        });
        document.addEventListener("input", function (e) {
          var k = e.target.dataset && e.target.dataset.filter;
          if (!k) return;
          F[k] = e.target.value;
          var body = document.getElementById("rapatBody");
          if (body) body.innerHTML = rapatRows();
        });
        document.addEventListener("change", function (e) {
          var k = e.target.dataset && e.target.dataset.filter;
          if (!k || e.target.type === "search") return;
          F[k] = e.target.value;
          var body = document.getElementById("rapatBody");
          if (body) body.innerHTML = rapatRows();
        });
        document.addEventListener("click", function (e) {
          var el = e.target.closest("[data-act]");
          if (!el) {
            if (e.target.id === "modal") closeModal();
            return;
          }
          var act = el.dataset.act,
            id = +el.dataset.id;
          switch (act) {
            case "quick":
              var f = el.closest("form");
              f.querySelector("[name=username]").value = el.dataset.u;
              f.querySelector("[name=password]").value = el.dataset.p;
              H.login(f, new FormData(f));
              break;
            case "logout":
              DB.session = null;
              save();
              flash("Anda telah keluar.", "info");
              location.hash = "";
              render();
              break;
            case "nav-toggle":
              document.body.classList.toggle("nav-open");
              break;
            case "nav-close":
              document.body.classList.remove("nav-open");
              break;
            case "modal-close":
              closeModal();
              break;
            case "confirm-yes":
              closeModal();
              if (pendingConfirm) pendingConfirm();
              pendingConfirm = null;
              break;
            case "reset-filter":
              F = { q: "", bulan: "", status: "" };
              render();
              break;
            case "export-csv":
              exportRapat();
              break;
            case "export-rekap":
              exportRekap(el.dataset.bulan);
              break;
            case "del-rapat":
              confirmBox(el.dataset.msg, function () {
                DB.rapat = DB.rapat.filter(function (r) {
                  return r.id !== id;
                });
                DB.dispo = DB.dispo.filter(function (d) {
                  return d.rapat_id !== id;
                });
                save();
                flash("Jadwal rapat dihapus.");
                go("#/rapat");
              });
              break;
            case "del-event":
              confirmBox(el.dataset.msg, function () {
                DB.events = DB.events.filter(function (x) {
                  return x.id !== id;
                });
                save();
                flash("Event/reminder dihapus.");
                render();
              });
              break;
            case "del-pegawai":
              confirmBox(el.dataset.msg, function () {
                var n = DB.dispo.filter(function (d) {
                  return d.pegawai_id === id;
                }).length;
                if (n)
                  flash(
                    "Pegawai memiliki " +
                      n +
                      " riwayat tugas sehingga tidak dapat dihapus. Nonaktifkan saja agar riwayat kinerja tetap tersimpan.",
                    "error",
                  );
                else {
                  DB.pegawai = DB.pegawai.filter(function (p) {
                    return p.id !== id;
                  });
                  DB.users.forEach(function (u) {
                    if (u.pegawai_id === id) u.pegawai_id = null;
                  });
                  DB.events = DB.events.filter(function (x) {
                    return x.untuk_pegawai_id !== id;
                  });
                  save();
                  flash("Data pegawai dihapus.");
                }
                render();
              });
              break;
            case "del-user":
              confirmBox(el.dataset.msg, function () {
                DB.users = DB.users.filter(function (u) {
                  return u.id !== id;
                });
                save();
                flash("Akun pengguna dihapus.");
                render();
              });
              break;
            case "reset-demo":
              pendingConfirm = function () {
                var s = DB.session;
                seed();
                DB.session = byId(DB.users, s) ? s : 1;
                save();
                flash("Data demo dikembalikan ke kondisi awal.");
                render();
              };
              modal(
                '<h3>Reset data demo?</h3><p>Semua perubahan akan hilang.</p><div class="form-actions"><button class="btn btn-light" data-act="modal-close">Batal</button><button class="btn btn-danger" data-act="confirm-yes">Reset</button></div>',
              );
              break;
            case "view-file":
              var d = byId(DB.dispo, id);
              if (!d || !d.file) return;
              var isImg = d.file.data && /^data:image\//.test(d.file.data);
              modal(
                "<h3>" +
                  icon("file", 18) +
                  " " +
                  esc(d.file.name) +
                  "</h3>" +
                  (isImg
                    ? '<img src="' +
                      d.file.data +
                      '" style="max-width:100%;border-radius:8px;margin-top:10px">'
                    : '<p class="muted">Ukuran: ' +
                      Math.round(d.file.size / 1024) +
                      " KB.<br>Pratinjau " +
                      (d.file.data
                        ? "hanya tersedia untuk gambar pada versi demo."
                        : "tidak tersedia (data contoh).") +
                      " Pada versi server, file dapat dibuka &amp; diunduh langsung.</p>") +
                  '<div class="form-actions"><button class="btn btn-primary" data-act="modal-close">Tutup</button></div>',
              );
              break;
          }
        });
        window.addEventListener("hashchange", render);
        render();
        setTimeout(checkReminders, 1000);
      })();
    </script>
